<!DOCTYPE html>

<div class="container">
  <div class="left-panel">
    <h1>🎡 Spin Wheel Giveaway</h1>

    <textarea id="participantInput" placeholder="Masukkan peserta...\n1 nama per baris"></textarea>

    <div class="buttons">
      <button onclick="addParticipants()">Tambah Peserta</button>
      <button class="danger" onclick="clearParticipants()">Clear</button>
    </div>

    <div class="option-box">
      <label>
        <input type="checkbox" id="removeWinner" checked>
        Auto Remove Setelah Menang
      </label>
    </div>

    <label>Jumlah Multi Spin</label>
    <input type="number" id="multiSpin" min="1" value="1">

    <button class="spin-btn" onclick="startSpin()">🎯 SPIN NOW</button>

    <div class="winner-box">
      <h2>🏆 Winner</h2>
      <div id="winnerName">Belum ada winner</div>
    </div>
  </div>

  <div class="right-panel">

    <div class="wheel-wrapper">
      <div class="pointer">▼</div>

      <canvas id="wheelCanvas" width="500" height="500"></canvas>
    </div>

    <div class="list-box">
      <h2>📋 Peserta</h2>
      <ul id="participantList"></ul>
    </div>

    <div class="history-box">
      <h2>🎉 Riwayat Winner</h2>
      <ul id="winnerHistory"></ul>
    </div>

  </div>
</div>

<audio id="spinSound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
